name: CI - Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.10"
            uv-python: "3.10"
          - python-version: "3.11"
            uv-python: "3.11"
          - python-version: "3.12"
            uv-python: "3.12"
          - python-version: "3.13"
            uv-python: "3.13"
          - python-version: "3.14"
            uv-python: "3.14"
    # Without UV_PYTHON, uv uses .python-version (3.14) instead of the matrix interpreter.
    env:
      UV_PYTHON: ${{ matrix.uv-python }}
    steps:
      #----------------------------------------------
      #       check-out repo and set-up python
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v3
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v4
        with:
          python-version: ${{matrix.python-version}}
      #----------------------------------------------
      #  -----  install & configure uv  -----
      #----------------------------------------------
      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      #----------------------------------------------
      # install dependencies
      #----------------------------------------------
      - name: Install dependencies
        run: uv sync --frozen
      - name: Show Python version
        run: uv run python --version
      #----------------------------------------------
      # Run linting and tests
      #----------------------------------------------
      - name: Ruff format check
        run: |
          uv run ruff format --check .
      - name: Ruff linting
        run: |
          uv run ruff check .
      - name: Type check with ty
        run: |
          uv run ty check
      - name: Check import contracts
        run: |
          make lint-imports
      - name: Test with pytest
        run: |
          uv run pytest -vv --cov=clientele --cov-branch --cov-report=term-missing --cov-report=xml --cov-config=pyproject.toml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.12'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
